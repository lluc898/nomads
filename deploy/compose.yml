name: viajeroshub

services:
  database:
    image: postgres:17-alpine
    container_name: viajeroshub-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    image: viajeroshub-migrator:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    image: viajeroshub-web:latest
    container_name: viajeroshub-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://viajes.llucbosch.com}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AVATAR_STORAGE_DIR: /app/data/avatars
      EXPO_TUNNEL_FILE: /app/expo-state/tunnel-url
      NEXT_PUBLIC_APP_URL: https://viajes.llucbosch.com
    volumes:
      - avatar-data:/app/data/avatars
      - expo-state:/app/expo-state:ro
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - npm
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/trips').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mobile-dev:
    profiles: ["mobile"]
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile.dev
    image: viajeroshub-mobile-dev:latest
    container_name: viajeroshub-mobile-dev
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      EXPO_TOKEN: ${EXPO_TOKEN:-}
      EXPO_UNSTABLE_TUNNEL_V2: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_PACKAGER_HOST:-192.168.1.200}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://viajes.llucbosch.com/api}
      EXPO_TUNNEL_FILE: /app/state/tunnel-url
    volumes:
      - expo-state:/app/state
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 20s
      timeout: 12s
      retries: 2
      start_period: 60s

volumes:
  avatar-data:
  database-data:
  expo-state:

networks:
  internal:
    internal: true
  npm:
    name: nginx-proxy-manager_default
    external: true
